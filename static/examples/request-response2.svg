<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#e2e8f0" />
        </linearGradient>
        
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
        </filter>

        <marker id="arrowRight" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
        </marker>
        <marker id="arrowLeft" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 10 0 L 0 5 L 10 10 z" fill="#94a3b8" />
        </marker>
    </defs>

    <rect width="100%" height="100%" fill="url(#bgGrad)" />

    <path d="M 220 180 L 610 180" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8, 8" fill="none" marker-end="url(#arrowRight)"/>
    <path d="M 610 230 L 220 230" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8, 8" fill="none" marker-end="url(#arrowLeft)"/>

    <path d="M 750 180 L 820 180" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrowRight)"/>
    <path d="M 820 230 L 750 230" stroke="#cbd5e1" stroke-width="3" fill="none" marker-end="url(#arrowLeft)"/>


    <g transform="translate(50, 130)" filter="url(#shadow)">
        <rect x="0" y="0" width="160" height="120" rx="6" fill="#475569" />
        <rect x="5" y="5" width="150" height="110" rx="3" fill="#ffffff" />
        <path d="M -20 120 L 180 120 L 160 135 L 0 135 Z" fill="#64748b" />
        
        <rect x="5" y="5" width="150" height="15" fill="#f1f5f9" rx="3" />
        <circle cx="15" cy="12.5" r="3" fill="#ef4444" />
        <circle cx="25" cy="12.5" r="3" fill="#f59e0b" />
        <circle cx="35" cy="12.5" r="3" fill="#10b981" />
        <rect x="50" y="9" width="90" height="7" fill="#e2e8f0" rx="3" />
        
        <g>
            <rect x="10" y="30" width="140" height="80" fill="#f8fafc" rx="2" />
            <text x="80" y="75" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Requesting...</text>
            
            <g opacity="0">
                <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.74;0.75;0.86;0.875;1" dur="8s" repeatCount="indefinite"/>
                <rect x="10" y="30" width="140" height="80" fill="#f8fafc" rx="2" />
                
                <path d="M 60 40 L 90 40 L 100 50 L 100 80 L 60 80 Z" fill="#10b981" />
                <path d="M 90 40 L 90 50 L 100 50 Z" fill="#059669" />
                <text x="80" y="65" font-family="sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">HTML</text>
                
                <text x="80" y="100" font-family="sans-serif" font-size="10" font-weight="bold" fill="#334155" text-anchor="middle">Parsing DOM...</text>
            </g>

            <g opacity="0">
                <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.86;0.875;1" dur="8s" repeatCount="indefinite"/>
                <rect x="10" y="30" width="140" height="80" fill="#3b82f6" rx="2" />
                <text x="80" y="60" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Hello World!</text>
                <rect x="30" y="75" width="100" height="6" fill="white" opacity="0.6" rx="3" />
                <rect x="40" y="87" width="80" height="6" fill="white" opacity="0.6" rx="3" />
            </g>
        </g>
        <text x="80" y="165" font-family="sans-serif" font-size="16" font-weight="bold" fill="#334155" text-anchor="middle">Client (Browser)</text>
    </g>


    <g transform="translate(630, 90)" filter="url(#shadow)">
        <rect x="0" y="0" width="320" height="250" rx="10" fill="#1e293b" />
        <text x="160" y="30" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc" text-anchor="middle">Linux Server</text>
        
        <g transform="translate(20, 60)">
            <rect x="0" y="0" width="100" height="150" rx="6" fill="#009639" />
            <rect x="5" y="5" width="90" height="140" rx="4" fill="#15803d" />
            <text x="50" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Nginx</text>
            <text x="50" y="60" font-family="monospace" font-size="12" fill="#bbf7d0" text-anchor="middle">Proxy</text>
            
            <rect x="15" y="110" width="70" height="24" rx="12" fill="#166534" />
            <text x="50" y="127" font-family="monospace" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">:80</text>
        </g>

        <g transform="translate(200, 60)">
            <rect x="0" y="0" width="100" height="150" rx="6" fill="#00a29c" />
            <rect x="5" y="5" width="90" height="140" rx="4" fill="#0f766e" />
            <text x="50" y="40" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Golang</text>
            <text x="50" y="60" font-family="monospace" font-size="12" fill="#ccfbf1" text-anchor="middle">App</text>
            
            <rect x="15" y="110" width="70" height="24" rx="12" fill="#115e59" />
            <text x="50" y="127" font-family="monospace" font-size="12" font-weight="bold" fill="#2dd4bf" text-anchor="middle">:8080</text>
        </g>
    </g>


    <g opacity="0" filter="url(#shadow)">
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.30;0.3125;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="transform" values="translate(220, 165); translate(600, 165); translate(800, 165); translate(800, 165)" keyTimes="0; 0.1875; 0.3125; 1" dur="8s" repeatCount="indefinite"/>
        
        <rect x="0" y="0" width="60" height="30" rx="4" fill="#ef4444" />
        <text x="30" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">GET /</text>
    </g>

    <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.31;0.32;0.43;0.44;1" dur="8s" repeatCount="indefinite"/>
        <text x="880" y="145" font-family="monospace" font-size="28" fill="#5eead4" text-anchor="middle">
            <animate attributeName="text" values=".;..;...;." dur="0.5s" repeatCount="indefinite" />
        </text>
        <text x="880" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ccfbf1" text-anchor="middle">Building</text>
    </g>

    <g opacity="0" filter="url(#shadow)">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.43;0.4375;0.74;0.75;1" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="transform" values="translate(800, 210); translate(800, 210); translate(600, 210); translate(220, 210); translate(220, 210)" keyTimes="0; 0.4375; 0.5625; 0.75; 1" dur="8s" repeatCount="indefinite"/>
        
        <path d="M 0 0 L 35 0 L 45 10 L 45 40 L 0 40 Z" fill="#10b981" />
        <path d="M 35 0 L 35 10 L 45 10 Z" fill="#059669" />
        <text x="22" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">HTML</text>
    </g>

</svg>
