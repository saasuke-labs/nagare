{{define "database"}}
<!-- Database -->
<g transform="translate({{ .X }}, {{.Y }})">
        <rect x="0" y="0" width="{{ .Width }}" height="{{ .Height }}" fill="{{.Props.BackgroundColor}}"></rect>
        <ellipse cx="{{ div .Width 2 }}" cy="0" rx="{{ div .Width 2}}" ry="15" fill="{{.Props.AccentColor}}"></ellipse>
        <ellipse cx="{{ div .Width 2 }}" cy="{{ .Height }}" rx="50" ry="15" fill="{{.Props.BackgroundColor}}"></ellipse>
        <text x="{{ div .Width 2 }}" y="{{ div .Height 2}}" text-anchor="middle" font-family="Arial" font-size="16" fill="{{.Props.ForegroundColor}}">{{.Props.Title}}</text>
        <text x="{{ div .Width 2 }}" y="{{ div .Height 1.5}}" text-anchor="middle" font-family="Arial" font-size="12" fill="{{.Props.ForegroundColor}}">{{.Props.Engine}}</text>
    </svg>
</g>
{{end}}
