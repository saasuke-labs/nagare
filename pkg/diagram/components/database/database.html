{{define "database"}}
<!-- Database -->
<g transform="translate({{ .X }}, {{.Y }})">
  <rect
    x="0"
    y="0"
    width="{{ .Width }}"
    height="{{ .Height }}"
    fill="{{.Props.BackgroundColor}}"
  ></rect>
  <ellipse
    cx="{{ div .Width 2 }}"
    cy="0"
    rx="{{ div .Width 2}}"
    ry="15"
    fill="{{.Props.AccentColor}}"
  ></ellipse>
  <ellipse
    cx="{{ div .Width 2 }}"
    cy="{{ .Height }}"
    rx="50"
    ry="15"
    fill="{{.Props.BackgroundColor}}"
  ></ellipse>
  <text
    x="{{ div .Width 2 }}"
    y="{{ div .Height 2}}"
    text-anchor="middle"
    font-family="Arial"
    font-size="16"
    fill="{{.Props.ForegroundColor}}"
    >{{.Props.Title}}</text
  >
  <text
    x="{{ div .Width 2 }}"
    y="{{ div .Height 1.5}}"
    text-anchor="middle"
    font-family="Arial"
    font-size="12"
    fill="{{.Props.ForegroundColor}}"
    >{{.Props.Engine}}</text
  >

  <ellipse cx="80" cy="20" rx="10" ry="9" fill="limegreen" opacity="0">
    <animate
      attributeName="opacity"
      begin="1s"
      dur="2s"
      values="0;0.35;0.1;0.8;0.15;0.6;0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />
  </ellipse>

  <ellipse cx="80" cy="20" rx="6" ry="5" fill="darkgreen">
    <animate
      attributeName="fill"
      begin="1s"
      dur="2s"
      values="darkgreen;#4ade80;#22c55e;#86efac;#16a34a;#4ade80;darkgreen"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />
  </ellipse>

  <ellipse cx="60" cy="20" rx="10" ry="9" fill="coral" opacity="0">
    <animate
      attributeName="opacity"
      begin="3s"
      dur="2s"
      values="0;0.35;0.1;0.8;0.15;0.6;0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />
  </ellipse>

  <ellipse cx="60" cy="20" rx="6" ry="5" fill="darkred">
    <animate
      attributeName="fill"
      begin="3s"
      dur="2s"
      values="darkred;#f87171;#ef4444;#dc2626;#b91c1c;#f87171;darkred"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />
  </ellipse>
</g>
{{end}}
