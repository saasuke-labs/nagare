{{define "database"}}
<!-- Database -->
<g transform="translate({{ .X }}, {{.Y }})">
  <defs>
    <!-- TODO - populate ID and type and make it available in the template -->
    <linearGradient id="db@database" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="{{ .Props.BackgroundColor }}" />
      <stop offset="100%" stop-color="{{ .Props.AccentColor }}" />
    </linearGradient>
  </defs>

  <rect
    x="0"
    y="0"
    width="{{ .Width }}"
    height="{{ .Height }}"
    fill="url(#db@database)"
  ></rect>
  <ellipse
    cx="{{ div .Width 2 }}"
    cy="0"
    rx="{{ div .Width 2}}"
    ry="15"
    fill="{{.Props.AccentColor}}"
  ></ellipse>
  <ellipse
    cx="{{ div .Width 2 }}"
    cy="{{ .Height }}"
    rx="{{ div .Width 2}}"
    ry="15"
    fill="url(#db@database)"
  ></ellipse>
  <text
    x="{{ div .Width 2 }}"
    y="{{ div .Height 2}}"
    text-anchor="middle"
    font-family="Arial"
    font-size="24"
    fill="{{.Props.ForegroundColor}}"
    >{{.Props.Title}}</text
  >
  <text
    x="{{ div .Width 2 }}"
    y="{{ div .Height 1.5}}"
    text-anchor="middle"
    font-family="Arial"
    font-size="22"
    fill="{{.Props.ForegroundColor}}"
    >{{.Props.Engine}}</text
  >

  <ellipse cx="250" cy="30" rx="10" ry="10" fill="darkgreen">
    {{ range $animation := index .Actions "read"}}
    <animate
      attributeName="opacity"
      begin="{{ index $animation "begin" }}"
      dur="{{ index $animation "dur" }}"
      values="0;0.35;0.1;0.8;0.15;0.6;0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />
    {{ end }}
  </ellipse>

  <ellipse cx="250" cy="30" rx="10" ry="10" fill="darkgreen">
    {{ range $animation := index .Actions "read"}}
    <animate
      attributeName="fill"
      begin="{{ index $animation "begin" }}"
      dur="{{ index $animation "dur" }}"
      values="darkgreen;#4ade80;#22c55e;#86efac;#16a34a;#4ade80;darkgreen"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />

    {{ end }}
  </ellipse>

  <ellipse cx="200" cy="30" rx="10" ry="10" fill="coral" opacity="0">
    {{ range $animation := index .Actions "write"}}
    <animate
      attributeName="opacity"
      begin="{{ index $animation "begin" }}"
      dur="{{ index $animation "dur" }}"
      values="0;0.35;0.1;0.8;0.15;0.6;0"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />
    {{ end }}
  </ellipse>

  <ellipse cx="200" cy="30" rx="10" ry="10" fill="darkred">
    {{ range $animation := index .Actions "write"}}
    <animate
      attributeName="fill"
      begin="{{ index $animation "begin" }}"
      dur="{{ index $animation "dur" }}"
      values="darkred;#f87171;#ef4444;#dc2626;#b91c1c;#f87171;darkred"
      keyTimes="0;0.15;0.3;0.45;0.6;0.85;1"
      repeatCount="1"
      fill="remove"
    />
    {{ end }}
  </ellipse>
</g>
{{end}}
