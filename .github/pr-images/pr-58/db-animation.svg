<svg viewBox="0 0 1000.000000 800.000000"  xmlns="http://www.w3.org/2000/svg">
<!-- Background -->
<rect width="1000.000000" height="800.000000" fill="#ccc"></rect>
<g transform="translate(300.000000,200.000000)">

<g transform="translate(300, 200)">
  <defs>
    
    <linearGradient id="db@database" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="DodgerBlue" />
      <stop offset="100%" stop-color="#4EC0FF" />
