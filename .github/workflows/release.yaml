name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on tags like v1.2.3
  # Manual fallback: release an existing tag. Needed when the tag push did not
  # trigger a run (e.g. the tagged commit message contains "[skip ci]").
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write # Needed to upload release assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # GoReleaser needs history and tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Import GPG key (optional)
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag explicitly: several tags may point at the same commit.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

      # Rebuild saasuke-labs.com so the new version and release notes show up.
      # Needs the SITE_DISPATCH_TOKEN secret (fine-grained PAT with
      # "Contents: read and write" on saasuke-labs/site-source). Without it the
      # step is skipped and the site catches up on its daily rebuild.
      - name: Announce release to the website
        if: env.SITE_DISPATCH_TOKEN != ''
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/saasuke-labs/site-source/dispatches \
            -d "{\"event_type\":\"product-release\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"tag\":\"$TAG\"}}"
